name: Build

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libfontconfig1 libglib2.0-0
      - name: Install
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Stamp the version
        shell: bash
        run: echo "VERSION = \"$APP_VERSION\"" > ugc_cutter/version.py

      - name: Build for Linux
        if: runner.os == 'Linux'
        run: python -m PyInstaller --noconfirm --onefile --windowed --name ugc-cutter run.py
      - name: Test the Linux app with HEVC iPhone-style clips
        if: runner.os == 'Linux'
        shell: bash
        run: |
          status=0
          UGC_SELF_TEST_LOG=self-test.log dist/ugc-cutter --self-test tests/fixtures || status=$?
          cat self-test.log || true
          grep -q "$APP_VERSION" self-test.log || status=1
          exit $status

      - name: Build for Windows
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --onedir --windowed --name ugc-cutter run.py
      - name: Make the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\ugc-cutter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install it and test the installed app with HEVC iPhone-style clips
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "installed"
          # -Wait would also wait for the app the installer opens at the end, which never closes here,
          # so wait for the installer itself only, then close the app it opened
          $setup = Start-Process dist\ugc-cutter-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"" -PassThru
          if (-not $setup.WaitForExit(300000)) { Write-Error "installer took too long"; exit 1 }
          if ($setup.ExitCode -ne 0) { Write-Error "installer failed: $($setup.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 5
          $opened = Get-Process -Name ugc-cutter -ErrorAction SilentlyContinue
          if (-not $opened) { Write-Error "the installer didn't open the app"; exit 1 }
          $opened | Stop-Process -Force
          $env:UGC_SELF_TEST_LOG = "$PWD\self-test.log"
          $test = Start-Process "$dir\ugc-cutter.exe" -ArgumentList "--self-test","tests\fixtures" -PassThru
          if (-not $test.WaitForExit(180000)) { Write-Error "self test took too long"; exit 1 }
          Get-Content self-test.log
          if ($test.ExitCode -ne 0) { Write-Error "self test failed: $($test.ExitCode)"; exit 1 }
          if (-not (Select-String -Path self-test.log -SimpleMatch $env:APP_VERSION)) { Write-Error "wrong version"; exit 1 }
          $uninstall = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -PassThru
          if (-not $uninstall.WaitForExit(120000)) { Write-Error "uninstaller took too long"; exit 1 }
          if ($uninstall.ExitCode -ne 0) { Write-Error "uninstaller failed"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ugc-cutter-${{ runner.os }}
          path: |
            dist/ugc-cutter-setup.exe
            dist/ugc-cutter
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "v$APP_VERSION" dist/ugc-cutter-setup.exe dist/ugc-cutter --latest --title "UGC Cutter $APP_VERSION" --notes "Built from ${{ github.sha }}."
